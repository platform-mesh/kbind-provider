# OCM component descriptor for the PlatformMesh kbind provider.
#
# Templated by `make ocm-build` (go templater). Helm charts are embedded directly
# from deploy/helm/ via `input: type: helm` — no pre-push to an OCI registry needed.
# Run `make ocm-stamp-chart-versions` (done automatically by `make ocm-build`) to
# stamp Chart.yaml version/appVersion before packaging; Flux HelmRelease rejects
# charts where the OCI tag and Chart.yaml version differ.
#
# `make ocm-push` transfers the CTF with --copy-resources, relocating the image
# OCI references into $(OCM_REPO). The ManagedProvider (config/platfrom-mesh-ocm)
# then pulls every runtime deployment from this one component.
#
# OCI_TAG is the single source of truth for deployed images: it is stamped into each
# chart's image.tag by `make helm-push` (standalone Helm path) and referenced by the
# ociImage resources below — so the image resources and chart values stay in lockstep.
components:
  - name: github.com/platform-mesh/kbind-provider
    version: {{ .VERSION }}
    provider:
      name: platform-mesh
    resources:
      # ---- Helm charts (embedded from deploy/helm/) -------------------------
      - name: operator-chart
        type: helmChart
        version: {{ .CHART_VERSION }}
        input:
          type: helm
          path: ../deploy/helm/kbind-provider-operator
          version: {{ .CHART_VERSION }}
      - name: portal-chart
        type: helmChart
        version: {{ .CHART_VERSION }}
        input:
          type: helm
          path: ../deploy/helm/kbind-provider-portal
          version: {{ .CHART_VERSION }}

      # ---- Container images (OCI references, relocated by ocm-push) ---------
      - name: operator-image
        type: ociImage
        relation: local
        version: {{ .IMAGE_VERSION }}
        access:
          type: ociArtifact
          imageReference: {{ .IMAGE_REGISTRY }}/kbind-provider-operator:{{ .OCI_TAG }}
      - name: portal-image
        type: ociImage
        relation: local
        version: {{ .IMAGE_VERSION }}
        access:
          type: ociArtifact
          imageReference: {{ .IMAGE_REGISTRY }}/kbind-provider-portal:{{ .OCI_TAG }}
