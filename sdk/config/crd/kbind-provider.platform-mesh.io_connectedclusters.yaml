---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: connectedclusters.kbind-provider.platform-mesh.io
spec:
  group: kbind-provider.platform-mesh.io
  names:
    categories:
    - kbind-provider
    kind: ConnectedCluster
    listKind: ConnectedClusterList
    plural: connectedclusters
    singular: connectedcluster
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Connected")].status
      name: Connected
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastHeartbeatTime
      name: Last Heartbeat
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConnectedCluster records a single kbind bundle that was generated by the portal.
          It lives on the provider cluster and tracks both the API selection the user
          made and whether a consumer is actively heartbeating against this bundle.
          Cluster-scoped. Multiple ConnectedCluster objects may exist for the same consumer
          workspace (one per bundle generated).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConnectedClusterSpec is the desired state set by the portal
              at bundle-generation time.
            properties:
              bundleAPIs:
                description: bundleAPIs defines which provider-exported APIs are included
                  in this bundle.
                properties:
                  all:
                    description: |-
                      all, when true, means this bundle covers all APIs exported by this
                      provider. Mutually exclusive with apis. Immutable once set.
                    type: boolean
                    x-kubernetes-validations:
                    - message: all is immutable once set
                      rule: oldSelf == self
                  apis:
                    description: |-
                      apis is the explicit set of exported APIs included in this bundle,
                      identified by CRD name ("<plural>.<group>"). Must contain at least one
                      entry when all is false. Must be empty when all is true.
                    items:
                      description: |-
                        APIRef identifies an exported API by its CRD name on the provider,
                        i.e. "<plural>.<group>" (for example "cowboys.wildwest.platform-mesh.io").
                      properties:
                        name:
                          description: name is the CRD name of the exported API, "<plural>.<group>".
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
            required:
            - bundleAPIs
            type: object
          status:
            description: ConnectedClusterStatus is the observed state updated by the
              ConnectedClusterReconciler.
            properties:
              conditions:
                description: |-
                  conditions:
                    Connected — a Lease with matching holderIdentity exists and renewTime
                                is within 2× leaseDurationSeconds (currently 120 s).
                    Ready     — Connected is true and no internal errors.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHeartbeatTime:
                description: |-
                  lastHeartbeatTime is the most recent time the konnector renewed its
                  heartbeat Lease on the provider cluster. Updated by the reconciler each
                  time it observes a fresh Lease.renewTime. Nil until the consumer first
                  connects.
                format: date-time
                type: string
              leaseRef:
                description: |-
                  leaseRef points at the coordination.k8s.io/Lease maintained by the
                  konnector on this provider cluster as a heartbeat. Nil until the consumer
                  first connects. The Lease lives in the "kbind" namespace and is named
                  "consumer-<localClusterUID>".
                properties:
                  name:
                    description: name of the Lease.
                    minLength: 1
                    type: string
                  namespace:
                    description: namespace of the Lease.
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              localClusterUID:
                description: |-
                  localClusterUID is the consumer cluster's kube-system namespace UID —
                  identical to Connection.status.localClusterUID on the consumer side.
                  Set by the konnector when it first establishes its heartbeat Lease on the
                  provider (the value equals Lease.spec.holderIdentity). Immutable once set.
                  The ConnectedClusterReconciler uses this to match Leases to ConnectedClusters:
                  a Lease whose spec.holderIdentity equals this UID belongs to this bundle's
                  consumer.
                type: string
                x-kubernetes-validations:
                - message: localClusterUID is immutable once set
                  rule: oldSelf == '' || self == oldSelf
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
