apiVersion: v1
kind: Service
metadata:
  name: {{ include "kbind-provider-portal.fullname" . }}
  labels:
    {{- include "kbind-provider-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kbind-provider-portal.selectorLabels" . | nindent 4 }}
