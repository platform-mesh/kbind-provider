# Default values for kbind-provider-operator.

# -- Number of replicas for the operator deployment
replicaCount: 1

image:
  # -- Image repository
  repository: ghcr.io/platform-mesh/kbind-provider-operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: "@sha256:3fb0d1e8e93dbf50446aeb61c90b35bcebcabfe73879ad10aae08bb3267a8c22"

# -- Secrets for pulling images from a private registry
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full release name
fullnameOverride: ""

# -- Name of the pre-existing Secret that holds the kcp provider workspace kubeconfig.
# Both the init container and the operator mount this to connect to kcp.
# The Secret must exist before the chart is installed.
kcpKubeconfigSecret: kbind-provider-kubeconfig
# -- Key within the Secret that contains the kubeconfig data
kcpKubeconfigKey: kubeconfig

# -- Name of the APIExportEndpointSlice the kbind-provider-operator-operator watches.
# Must match the APIExport name created in the kcp provider workspace by operator init.
endpointSliceName: kbind-provider.platform-mesh.io

serviceAccount:
  # -- Whether to create a ServiceAccount for the operator pod
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount. If empty and create is true, a name is generated.
  name: ""
  # -- Do not auto-mount the ServiceAccount token — the operator uses the kcp kubeconfig, not in-cluster credentials
  automount: false

# -- Annotations to add to the pod
podAnnotations: {}
# -- Extra labels to add to the pod
podLabels: {}

# -- Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context (applied to both init and operator containers)
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# -- Resource requests and limits (applied to both init and operator containers)
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Host aliases injected into /etc/hosts — useful when kcp is reachable only via a local hostname
# @default -- `[]`
hostAliases: []
# Example:
# - ip: "1.2.3.4"
#   hostnames:
#     - kcp.api.portal.localhost

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}
